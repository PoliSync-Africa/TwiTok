name: TwiTok CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package.json
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run test:types
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package.json
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run test:types
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run test:types
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - run: npm install
      - name: Audit mobile dependencies
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const blocking = Object.values(report.vulnerabilities || {}).filter(
            (v) => ['high', 'critical'].includes(v.severity) && v.fixAvailable !== false
          );
          const unpatched = Object.values(report.vulnerabilities || {}).filter(
            (v) => ['high', 'critical'].includes(v.severity) && v.fixAvailable === false
          );
          for (const v of unpatched) {
            console.log(`::warning::Unpatched ${v.severity} vulnerability in ${v.name}; npm reports no available remediation yet.`);
          }
          if (blocking.length) {
            console.error(`Found ${blocking.length} high/critical mobile vulnerabilities with an available remediation.`);
            for (const v of blocking) {
              console.error(`- ${v.name}: fixAvailable=${JSON.stringify(v.fixAvailable)}`);
            }
            process.exit(1);
          }
          console.log('Mobile dependency audit passed: no high/critical vulnerability with an available remediation was found.');
          NODE
          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit reported findings; only findings without an available remediation are permitted by this mobile CI gate."
          fi
      - run: npm run typecheck
