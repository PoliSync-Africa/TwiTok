name: TwiTok Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [backend/api, apps/admin, apps/web, apps/mobile]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Audit production dependencies
        if: matrix.directory != 'apps/mobile'
        run: npm audit --omit=dev --audit-level=high
      - name: Audit mobile dependencies with unpatched-advisory handling
        if: matrix.directory == 'apps/mobile'
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const blocking = Object.values(report.vulnerabilities || {}).filter(
            (v) => ['high', 'critical'].includes(v.severity) && v.fixAvailable !== false
          );
          const unpatched = Object.values(report.vulnerabilities || {}).filter(
            (v) => ['high', 'critical'].includes(v.severity) && v.fixAvailable === false
          );
          for (const v of unpatched) {
            console.log(`::warning::Unpatched ${v.severity} vulnerability in ${v.name}; npm reports no available remediation yet.`);
          }
          if (blocking.length) {
            console.error(`Found ${blocking.length} high/critical mobile vulnerabilities with an available remediation.`);
            for (const v of blocking) {
              console.error(`- ${v.name}: fixAvailable=${JSON.stringify(v.fixAvailable)}`);
            }
            process.exit(1);
          }
          console.log('Mobile dependency security gate passed: no high/critical vulnerability with an available remediation was found.');
          NODE
          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit reported findings; only findings without an available remediation are permitted by this mobile security gate."
          fi
