services:
  - type: web
    name: twitok-api
    runtime: node
    rootDir: backend/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_FEED_EVENT_WORKER
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      - key: ADMIN_WEB_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: worker
    name: twitok-feed-events
    runtime: node
    rootDir: backend/api
    buildCommand: npm install && npm run build
    startCommand: npm run worker:feed-events
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
